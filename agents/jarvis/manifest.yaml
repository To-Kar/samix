id: jarvis
type: reactive
version: "1.0"
model:
  primary: claude-haiku-4-5
  fallback: ollama-llama3
budget:
  daily_usd_max: 1.00
  tokens_per_run_max: 4000
  halt_on_budget_exceeded: true
context:
  inject_ambient: true
tools:
  - get_datetime
  - web_search
  - list_recent_articles
  - open_url
  - search_notes
  - save_memory
  - recall_memory
output:
  format: freeform_text
