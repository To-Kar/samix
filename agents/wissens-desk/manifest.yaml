id: wissens-desk
type: reactive
version: "1.0"

model:
  # Needs tool calling (Claude, DeepSeek); there is no fallback without tools.
  primary: claude-haiku-4-5

budget:
  daily_usd_max: 0.20
  # One short routing call per question; the agent below has its own budget.
  tokens_per_run_max: 600
  halt_on_budget_exceeded: true

# A router one level below the orchestrator: what it may do, and whom it may hand questions to.
routes:
  - delegate
  - show_notes
delegates:
  - frag-die-zeitung

output:
  format: route
