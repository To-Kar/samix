id: orchestrator
type: reactive
version: "1.1"

model:
  # Needs tool calling (Claude, DeepSeek); there is no fallback without tools.
  primary: claude-haiku-4-5

budget:
  daily_usd_max: 0.20
  # One short routing call per question; delegates have their own budgets.
  tokens_per_run_max: 600
  halt_on_budget_exceeded: true

# What the orchestrator may do, and whom it may hand questions to.
routes:
  - delegate
  - show_notes
  - propose_refresh
delegates:
  - frag-die-zeitung
  - projekt-assistent

output:
  format: route
