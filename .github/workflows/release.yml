name: Release build

# Builds the installable app on the platforms it targets (macOS Apple Silicon,
# Windows x64) and attaches the installers as workflow artifacts. Unsigned and
# not notarised: for personal use (macOS: right-click → Open the first time;
# Windows: SmartScreen warning). Signing is Phase 5.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            triple: aarch64-apple-darwin
            exe: ''
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            exe: '.exe'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Expect Apple Silicon
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = "arm64"
      - run: pnpm install --frozen-lockfile
      - run: node app/scripts/fetch-node.mjs
      - run: pnpm --filter samix-core bundle
      - run: node core/scripts/verify-bundle.mjs app/src-tauri/resources/core app/src-tauri/binaries/node-${{ matrix.triple }}${{ matrix.exe }}
      - name: Build installers
        working-directory: app
        run: pnpm exec tauri build --config src-tauri/tauri.release.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: samix-${{ matrix.triple }}
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/macos/*.app
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
