name: Release build

# Builds the installable app on the platforms it targets (macOS Apple Silicon,
# Windows x64) and attaches the installers as workflow artifacts.
#
# Without the Apple secrets below the build is unsigned and not notarised: fine
# for personal use (macOS: right-click → Open the first time; Windows: SmartScreen
# warning). With them, the macOS build is signed and notarised. Windows is never
# signed here yet. On a tag (v1.2.3) the installers also go into a DRAFT GitHub
# release, which nothing publishes until a person does. UNTESTED on a real runner:
# see docs/SAMIX_RELEASE.md before relying on any of it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # Secrets cannot be tested in `if:` directly; this turns "is it set" into a flag.
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            triple: aarch64-apple-darwin
            exe: ''
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            exe: '.exe'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Expect Apple Silicon
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = "arm64"
      # A tag must name the version the app actually carries.
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/version.mjs --expect "${GITHUB_REF_NAME#v}"
      - run: pnpm install --frozen-lockfile
      - run: node app/scripts/fetch-node.mjs
      - run: pnpm --filter samix-core bundle
      - run: node core/scripts/verify-bundle.mjs app/src-tauri/resources/core app/src-tauri/binaries/node-${{ matrix.triple }}${{ matrix.exe }}
      - name: Build installers (unsigned)
        if: runner.os != 'macOS' || env.HAS_APPLE_SIGNING != 'true'
        working-directory: app
        run: pnpm exec tauri build --config src-tauri/tauri.release.conf.json
      # Tauri signs and notarises on macOS when these variables are present.
      - name: Build installers (macOS, signed and notarised)
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        working-directory: app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec tauri build --config src-tauri/tauri.release.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: samix-${{ matrix.triple }}
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/macos/*.app
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  # Only for tags. A draft: nothing is public until a person publishes it.
  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: installers/**/*
